          : "";
        return (
          '<div class="menu"><div class="menu-card"><div class="emblem"><span>' +
          crestSVG("pos") +
          "</span><span>" +
          crestSVG("neg") +
          "</span></div>" +
          '<h2 class="title">Ruangan Siap</h2><p class="tag">' +
          (V.hasMaster
            ? isMaster()
              ? "Bagikan kode ini kepada dua pemain. Permainan dimulai otomatis begitu keduanya bergabung dan kamu bisa menontonnya."
              : "Menunggu pemain lain. Permainan dimulai otomatis begitu dua pemain hadir."
            : "Bagikan kode ini kepada lawanmu. Permainan dimulai otomatis begitu dia bergabung.") +
          "</p>" +
          seats +
          '<div class="lobby-code">' +
          esc(V.code) +
          "</div>" +
          '<div class="menu-actions"><div class="row"><button class="btn blue" onclick="copyText(\'code\')">📋 Salin Kode</button><button class="btn ghost" onclick="copyText(\'link\')">🔗 Salin Tautan</button></div></div>' +
          '<p class="note"><span class="pulse">●</span> Menunggu ' +
          (V.hasMaster ? "pemain" : "lawan") +
          " bergabung…</p>" +
          '<p class="note">Aturan ruangan: peluang buff <b>' +
          c.buffChance +
          "%</b> · pasukan awal <b>" +
          c.initialArmy +
          "</b> · timer <b>" +
          (c.timer ? c.timer + " dtk" : "tanpa batas") +
          "</b></p>" +
          '<div class="menu-actions" style="margin-top:14px"><button class="btn ghost" onclick="leaveRoom()">' +
          (V.hasMaster && !isMaster() ? "Keluar" : "Batalkan Ruangan") +
          "</button></div></div></div>"
        );
      }
      function renderAbandonedHTML() {
        const who =
          V.leftBy === "master" && !isMaster()
            ? "Room Master menutup ruangan."
            : V.leftBy && V.leftBy !== ON.side
            ? esc(isMaster() ? V.names[V.leftBy] : oppName()) +
              " meninggalkan permainan."
            : "Ruangan ini sudah ditutup.";
        return (
          '<div class="menu"><div class="menu-card"><div class="big-ic" style="font-size:3rem">🏳️</div><h2 class="title">Permainan Berakhir</h2><p class="tag">' +
          who +
          "</p>" +
          '<div class="menu-actions"><button class="btn big" onclick="leaveRoom(true)">🏠 Kembali ke Menu</button><button class="btn ghost" onclick="showHistory()">📜 Lihat Riwayat</button></div></div></div>'
        );
      }
      function rematchBtn() {
        if (isMaster())
          return (
            '<button class="btn big" disabled>👁 Menunggu pemain memutuskan main lagi' +
            (V.rematch.pos || V.rematch.neg
              ? " (" +
                (V.rematch.pos ? "✔" : "⌛") +
                " · " +
                (V.rematch.neg ? "✔" : "⌛") +
                ")"
              : "") +
            "</button>"
          );
        const me = V.rematch[ON.side],
          opp = V.rematch[oppSide()];
        if (V.leftBy && V.leftBy !== ON.side)
          return '<button class="btn big" disabled>🔁 Lawan sudah keluar</button>';
        if (me)
          return (
            '<button class="btn big" disabled>⏳ Menunggu ' +
            esc(oppName()) +
            "…</button>"
          );
        return (
          '<button class="btn big" onclick="requestRematch()">🔁 ' +
          (opp ? esc(oppName()) + " ingin main lagi — Setuju" : "Main Lagi") +
          "</button>"
        );
      }

      /* ---------- modal & pengaturan ---------- */
      function showHowTo() {
        showModal(howToHTML());
      }
      function settingsHTML() {
        return (
          '<h2>Pengaturan</h2><p style="color:var(--mut);font-size:.85rem;margin-bottom:6px">Pengaturan ini hanya berlaku di perangkatmu. Aturan permainan (buff, pasukan awal, timer) ditentukan pembuat ruangan.</p>' +
          '<div class="setrow"><div>Efek suara<small>Suara sintetis dari browser, tanpa file eksternal</small></div><input type="checkbox" ' +
          (settings.sound ? "checked" : "") +
          " onchange=\"setSetting('sound',this.checked)\"></div>" +
          '<div class="setrow"><div>Musik latar mencekam</div><input type="checkbox" ' +
          (settings.music ? "checked" : "") +
          " onchange=\"setSetting('music',this.checked)\"></div>" +
          '<div class="setrow"><div>Volume</div><input type="range" min="0" max="100" value="' +
          settings.volume +
          '" onchange="setSetting(\'volume\',this.value)"></div>' +
          '<div class="setrow"><div>Suara narator<small>Membacakan skenario dengan suara bawaan browser (bahasa Indonesia bila tersedia)</small></div><input type="checkbox" ' +
          (settings.narrator ? "checked" : "") +
          " onchange=\"setSetting('narrator',this.checked)\"></div>" +
          '<div class="setrow"><div>Hitung mundur pembukaan kartu (detik)<small>1–5</small></div><input type="number" min="1" max="5" value="' +
          settings.countdown +
          '" onchange="setSetting(\'countdown\',this.value)"></div>' +
          '<div class="setrow"><div>Animasi penuh<small>Matikan agar hasil tampil lebih cepat</small></div><input type="checkbox" ' +
          (settings.anim ? "checked" : "") +
          " onchange=\"setSetting('anim',this.checked)\"></div>" +
          '<div class="setrow"><div>Layar penuh otomatis<small>Di HP: ketukan pertama langsung masuk layar penuh</small></div><input type="checkbox" ' +
          (settings.autoFullscreen ? "checked" : "") +
          " onchange=\"setSetting('autoFullscreen',this.checked)\"></div>" +
          '<div class="setrow"><div>Getar<small>Getaran ringan saat memilih &amp; mengunci kartu</small></div><input type="checkbox" ' +
          (settings.haptics ? "checked" : "") +
          " onchange=\"setSetting('haptics',this.checked)\"></div>" +
          '<div class="mrow"><button class="btn" onclick="closeModal()">Selesai</button></div>'
        );
      }
      function showSettings() {
        showModal(settingsHTML());
      }
      function showHistory() {
        showModal(
          historyHTML(V && V.g) +
            '<div class="mrow"><button class="btn" onclick="closeModal()">Tutup</button></div>'
        );
      }

      /* ---------- init ---------- */
      async function initGame() {
        settings = loadSettings();
        ON = null;
        V = null;
        document.addEventListener("keydown", (ev) => {
          if (ev.key === "Escape") closeModal();
        });
        document.addEventListener("click", (ev) => {
          const b = ev.target.closest && ev.target.closest("button");
          if (b && !b.disabled && !b.hasAttribute("data-nosfx")) Sfx.click();
        });
        const unlock = () => Sfx.apply();
        document.addEventListener("pointerdown", unlock, { once: true });
        document.addEventListener("keydown", unlock, { once: true });
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden && ON) {
            pollOnce();
            keepAwake();
          }
        });
        const q = new URLSearchParams(location.search),
          roomParam = (q.get("room") || "")
            .toUpperCase()
            .replace(/[^A-Z0-9]/g, "")
            .slice(0, 5);
        const saved = loadSession();
        if (roomParam && !(saved && saved.code === roomParam))
          menuForm.code = roomParam;
        if (saved && (!roomParam || roomParam === saved.code)) {
          ON = saved;
          try {
            const r = await fetch(
              API +
                "?" +
                new URLSearchParams({ code: ON.code, token: ON.token, v: 0 }),
              { cache: "no-store" }
            );
            const j = await r.json();
            if (j.ok && j.view && j.view.status !== "abandoned") {
              applyView(j.view);
              startPolling();
              armBackGuard();
              keepAwake();
              return;
            }
          } catch (e) {
            /* jatuh ke menu */
          }
          clearSession();
          ON = null;
          V = null;
        }
        renderGame();
      }
      // Service worker minimal (tanpa cache) agar game bisa dipasang sebagai aplikasi layar penuh
      if ("serviceWorker" in navigator && location.protocol !== "file:") {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
      if (typeof document !== "undefined") {
        if (document.readyState === "loading")
          document.addEventListener("DOMContentLoaded", initGame);
        else initGame();
      }
    </script>
  </body>
</html>
