<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#08070f" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="ZENITHRONE" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/icon-192.png"
    />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>POSITIVE vs NEGATIVE: ZENITHRONE · Online</title>
    <style>
      :root {
        --bg: #07060d;
        --gold: #f5c451;
        --gold2: #ffe29a;
        --blue: #4aa8ff;
        --blue-d: #0f2447;
        --red: #d3304a;
        --red-d: #2a0813;
        --purple: #9a4dff;
        --purple-d: #2a1250;
        --ink: #ece8f8;
        --mut: #9d98b8;
        --panel: rgba(20, 17, 34, 0.86);
        --line: rgba(255, 255, 255, 0.09);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        background: radial-gradient(
            1100px 560px at 12% -10%,
            rgba(74, 168, 255, 0.2),
            transparent 60%
          ),
          radial-gradient(
            1100px 560px at 88% -10%,
            rgba(211, 48, 74, 0.22),
            transparent 60%
          ),
          linear-gradient(#08070f, #0e0a1a);
        background-attachment: fixed;
        color: var(--ink);
        font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
        min-height: 100vh;
        min-height: 100dvh;
        overscroll-behavior-y: contain; /* cegah tarik-untuk-muat-ulang yang tak sengaja di Android */
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }
      html {
        background: #08070f;
      }
      /* sentuhan: tanpa seleksi teks / menu tekan-lama, tanpa tunda ketuk ganda */
      body {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      input,
      select,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      button,
      .btn,
      .fbtn,
      .card,
      .roomchip,
      summary,
      select,
      input {
        touch-action: manipulation;
      }
      h1,
      h2,
      h3,
      .title {
        font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia,
          serif;
        letter-spacing: 0.05em;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        color: inherit;
        background: none;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      input {
        font: inherit;
      }
      .btn {
        background: linear-gradient(180deg, #ffe29a, #f5c451 55%, #c99118);
        color: #2a1d00;
        font-weight: 800;
        padding: 0.8em 1.4em;
        border-radius: 12px;
        letter-spacing: 0.04em;
        box-shadow: 0 6px 18px rgba(245, 196, 81, 0.25),
          inset 0 1px 0 rgba(255, 255, 255, 0.6);
        transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
      }
      .btn:hover:not(:disabled) {
        transform: translateY(-2px);
        filter: brightness(1.07);
      }
      .btn.ghost {
        background: rgba(255, 255, 255, 0.06);
        color: var(--ink);
        box-shadow: none;
        border: 1px solid var(--line);
        font-weight: 600;
      }
      .btn.ghost:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.12);
      }
      .btn.neg {
        background: linear-gradient(180deg, #ff6d84, #d3304a 55%, #8c1230);
        color: #fff;
        box-shadow: 0 6px 18px rgba(211, 48, 74, 0.3);
      }
      .btn.blue {
        background: linear-gradient(180deg, #8cc8ff, #4aa8ff 55%, #2467b3);
        color: #041a36;
      }
      .btn.small {
        padding: 0.5em 0.9em;
        font-size: 0.85rem;
        border-radius: 9px;
      }
      .btn.big {
        font-size: 1.15rem;
        padding: 1em 2em;
      }

      /* ===== MENU ===== */
      .menu {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .menu-card {
        width: min(640px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(245, 196, 81, 0.12);
        backdrop-filter: blur(8px);
      }
      .emblem {
        display: flex;
        justify-content: center;
        gap: 22px;
        margin-bottom: 8px;
      }
      .emblem svg {
        width: 78px;
        height: 78px;
        filter: drop-shadow(0 0 14px currentColor);
      }
      .game-title {
        font-size: clamp(1.6rem, 5vw, 2.5rem);
        line-height: 1.15;
      }
      .t-pos {
        color: var(--gold);
        text-shadow: 0 0 22px rgba(74, 168, 255, 0.6);
      }
      .t-neg {
        color: #ff5b78;
        text-shadow: 0 0 22px rgba(154, 77, 255, 0.7);
      }
      .game-title .vs {
        color: var(--mut);
        font-size: 0.6em;
        padding: 0 0.3em;
      }
      .subtitle {
        letter-spacing: 0.5em;
        color: var(--mut);
        font-size: 0.8rem;
        margin: 6px 0 16px;
      }
      .tag {
        color: #c8c3de;
        line-height: 1.55;
        margin-bottom: 20px;
        font-size: 0.95rem;
      }
      .names {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-bottom: 10px;
        text-align: left;
      }
      .names label {
        font-size: 0.78rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        display: block;
        margin-bottom: 6px;
      }
      .names .l1 {
        color: var(--gold);
      }
      .names .l2 {
        color: #ff7f95;
      }
      .names input {
        width: 100%;
        padding: 0.8em 1em;
        border-radius: 11px;
        background: rgba(0, 0, 0, 0.4);
        color: #fff;
        border: 1px solid var(--line);
        outline: none;
      }
      .names .i1 input:focus {
        border-color: var(--gold);
        box-shadow: 0 0 0 3px rgba(245, 196, 81, 0.2);
      }
      .names .i2 input:focus {
        border-color: var(--red);
        box-shadow: 0 0 0 3px rgba(211, 48, 74, 0.25);
      }
      .err {
        color: #ff8da0;
        min-height: 1.3em;
        font-size: 0.88rem;
        margin-bottom: 6px;
      }
      .menu-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 6px;
      }
      .menu-actions .row {
        display: flex;
        gap: 10px;
      }
      .menu-actions .row > * {
        flex: 1;
      }
      .note {
        margin-top: 18px;
        font-size: 0.78rem;
        color: var(--mut);
        line-height: 1.5;
      }
      .shake {
        animation: shake 0.4s;
      }
      @keyframes shake {
        20%,
        60% {
          transform: translateX(-6px);
        }
        40%,
        80% {
          transform: translateX(6px);
        }
      }

      /* ===== TOP BAR ===== */
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 16px;
        background: rgba(10, 8, 18, 0.85);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 20;
        backdrop-filter: blur(8px);
        flex-wrap: wrap;
      }
      .brand {
        font-size: 1rem;
        font-weight: 700;
        white-space: nowrap;
      }
      .brand .p {
        color: var(--gold);
      }
      .brand .n {
        color: #ff5b78;
      }
      .brand small {
        color: var(--mut);
        padding: 0 4px;
      }
      .roundbox {
        flex: 1;
        min-width: 180px;
        max-width: 420px;
        text-align: center;
      }
      .rnum {
        font-family: Georgia, serif;
        font-size: 1.1rem;
      }
      .rnum b {
        color: var(--gold2);
        font-size: 1.4rem;
      }
      .bar {
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        overflow: hidden;
        margin: 4px 0;
      }
      .bar i {
        display: block;
        height: 100%;
        background: linear-gradient(
          90deg,
          var(--blue),
          var(--gold),
          var(--red)
        );
        transition: width 0.6s;
      }
      .status {
        font-size: 0.78rem;
        color: var(--mut);
        letter-spacing: 0.06em;
      }
      .tools {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      /* ===== LAYOUT ===== */
      .layout {
        display: grid;
        grid-template-columns: 260px 1fr 260px;
        gap: 16px;
        padding: 16px;
        max-width: 1500px;
        margin: 0 auto;
        align-items: start;
      }
      .panel {
        background: var(--panel);
        border-radius: 18px;
        padding: 16px;
        border: 1px solid var(--line);
      }
      .panel.pos {
        border-color: rgba(245, 196, 81, 0.35);
        box-shadow: inset 0 0 40px rgba(74, 168, 255, 0.08);
      }
      .panel.neg {
        border-color: rgba(211, 48, 74, 0.4);
        box-shadow: inset 0 0 40px rgba(154, 77, 255, 0.1);
      }
      .panel .crest {
        display: flex;
        justify-content: center;
      }
      .panel .crest svg {
        width: 64px;
        height: 64px;
      }
      .panel h2 {
        text-align: center;
        font-size: 1.05rem;
        margin-top: 4px;
      }
      .panel.pos h2 {
        color: var(--gold);
      }
      .panel.neg h2 {
        color: #ff6e86;
      }
      .pname {
        text-align: center;
        color: var(--mut);
        font-size: 0.85rem;
        margin-bottom: 8px;
        word-break: break-word;
      }
      .army {
        text-align: center;
        margin: 8px 0 10px;
      }
      .army .num {
        font-family: Georgia, serif;
        font-size: 2.8rem;
        font-weight: 900;
        line-height: 1;
        display: inline-block;
      }
      .panel.pos .army .num {
        color: var(--gold2);
        text-shadow: 0 0 20px rgba(74, 168, 255, 0.7);
      }
      .panel.neg .army .num {
        color: #ff8da0;
        text-shadow: 0 0 20px rgba(154, 77, 255, 0.8);
      }
      .army .lbl {
        display: block;
        font-size: 0.7rem;
        letter-spacing: 0.2em;
        color: var(--mut);
        text-transform: uppercase;
      }
      .bump {
        animation: bump 0.9s;
      }
      @keyframes bump {
        30% {
          transform: scale(1.5);
        }
        100% {
          transform: scale(1);
        }
      }
      .stats {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 5px 10px;
        font-size: 0.84rem;
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }
      .stats span:nth-child(odd) {
        color: var(--mut);
      }
      .stats span:nth-child(even) {
        text-align: right;
        font-weight: 700;
      }
      .pubhist {
        margin-top: 12px;
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }
      .pubhist h4 {
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        color: var(--mut);
        text-transform: uppercase;
        margin-bottom: 6px;
        font-weight: 600;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .chip {
        font-size: 0.74rem;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 6px;
        font-family: Georgia, serif;
      }
      .chip.pos {
        background: rgba(74, 168, 255, 0.18);
        color: #bfe0ff;
        border: 1px solid rgba(74, 168, 255, 0.4);
      }
      .chip.neg {
        background: rgba(154, 77, 255, 0.18);
        color: #e0c9ff;
        border: 1px solid rgba(154, 77, 255, 0.45);
      }
      .chip sub {
        font-size: 0.6em;
        opacity: 0.65;
        margin-left: 2px;
      }
      .center {
        min-width: 0;
      }

      /* ===== BUFF BAR ===== */
      .buffbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 14px;
        border-radius: 14px;
        margin-bottom: 12px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--line);
        font-size: 0.9rem;
      }
      .buffbar .ic {
        font-size: 1.7rem;
      }
      .buffbar b {
        display: block;
        letter-spacing: 0.08em;
      }
      .buffbar.on {
        background: linear-gradient(
          90deg,
          rgba(245, 196, 81, 0.15),
          rgba(154, 77, 255, 0.18)
        );
        border-color: rgba(245, 196, 81, 0.5);
        box-shadow: 0 0 22px rgba(245, 196, 81, 0.15);
      }
      .buffbar.on b {
        color: var(--gold2);
      }
      .buffbar.off {
        color: var(--mut);
      }
      .drama {
        text-align: center;
        font-style: italic;
        color: #d9c7ff;
        margin: 4px 0 12px;
        min-height: 1.4em;
        font-size: 0.95rem;
      }

      /* ===== ARENA ===== */
      .arena {
        --cw: 150px;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: clamp(14px, 5vw, 64px);
        padding: 20px 10px 16px;
        border-radius: 20px;
        overflow: hidden;
        background: radial-gradient(
            ellipse at center,
            rgba(255, 255, 255, 0.07),
            transparent 70%
          ),
          linear-gradient(
            90deg,
            rgba(74, 168, 255, 0.12),
            transparent 50%,
            rgba(211, 48, 74, 0.14)
          );
        border: 1px solid var(--line);
      }
      .slot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        transition: opacity 0.6s, filter 0.6s, transform 0.4s;
      }
      .slot-label {
        font-size: 0.76rem;
        letter-spacing: 0.08em;
        color: var(--mut);
        max-width: calc(var(--cw) + 30px);
        text-align: center;
        word-break: break-word;
      }
      .slot.pos .slot-label {
        color: var(--gold);
      }
      .slot.neg .slot-label {
        color: #ff7f95;
      }
      .vsmark {
        font-family: Georgia, serif;
        font-size: 1.6rem;
        font-weight: 900;
        color: var(--mut);
        text-shadow: 0 0 14px rgba(255, 255, 255, 0.3);
      }
      .emptyslot {
        width: var(--cw);
        height: calc(var(--cw) * 1.45);
        border: 2px dashed rgba(255, 255, 255, 0.2);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 10px;
        color: var(--mut);
        font-size: 0.82rem;
      }
      .emptyslot.pos {
        border-color: rgba(245, 196, 81, 0.4);
      }
      .emptyslot.neg {
        border-color: rgba(211, 48, 74, 0.5);
      }
      .flip {
        position: relative;
        width: var(--cw);
        height: calc(var(--cw) * 1.45);
        transform-style: preserve-3d;
        transition: transform 0.9s cubic-bezier(0.3, 1.2, 0.4, 1);
      }
      .flip.flipped {
        transform: rotateY(180deg);
      }
      .flip .side {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        border-radius: 14px;
      }
      .flip .front {
        transform: rotateY(180deg);
      }
      .flip {
        --fw: var(--cw); /* ukuran dari arena, dipakai kartu di sisi depan */
      }
      .flip .front .card {
        --cw: var(--fw);
      }
      .back {
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      .back.pos {
        background: repeating-linear-gradient(
          45deg,
          #0f2447 0 10px,
          #12305e 10px 20px
        );
        border-color: var(--gold);
      }
      .back.neg {
        background: repeating-linear-gradient(
          45deg,
          #1a0610 0 10px,
          #2a1250 10px 20px
        );
        border-color: var(--red);
      }
      .back svg {
        width: 58%;
        opacity: 0.9;
      }
      .eff {
        min-height: 1.5em;
        font-size: 0.88rem;
        text-align: center;
      }
      .eff .o {
        color: var(--mut);
      }
      .eff .chg {
        color: var(--gold2);
      }
      .eff b {
        font-family: Georgia, serif;
      }
      .slot.win .card,
      .slot.win .back {
        box-shadow: 0 0 0 3px #fff, 0 0 46px 14px rgba(255, 214, 102, 0.75);
      }
      .slot.lose {
        opacity: 0.5;
        filter: saturate(0.3) brightness(0.8);
      }
      .arena.clash #slot-pos {
        animation: hitL 0.7s;
      }
      .arena.clash #slot-neg {
        animation: hitR 0.7s;
      }
      @keyframes hitL {
        40% {
          transform: translateX(46px) scale(1.07);
        }
        100% {
          transform: none;
        }
      }
      @keyframes hitR {
        40% {
          transform: translateX(-46px) scale(1.07);
        }
        100% {
          transform: none;
        }
      }
      .countdown {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-family: Georgia, serif;
        font-size: 5rem;
        font-weight: 900;
        color: var(--gold2);
        text-shadow: 0 0 30px rgba(245, 196, 81, 0.9);
        pointer-events: none;
        z-index: 3;
      }
      .countdown.tick {
        animation: tick 0.85s;
      }
      @keyframes tick {
        0% {
          transform: translate(-50%, -50%) scale(2.4);
          opacity: 0;
        }
        30% {
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -50%) scale(0.9);
          opacity: 0.2;
        }
      }
      .fx {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 4;
      }
      .pt {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        animation: pt 1s ease-out forwards;
      }
      @keyframes pt {
        to {
          transform: translate(var(--dx), var(--dy)) scale(0.2);
          opacity: 0;
        }
      }
      .flash {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle, #fff, transparent 60%);
        animation: flash 0.5s forwards;
      }
      @keyframes flash {
        from {
          opacity: 0.9;
        }
        to {
          opacity: 0;
        }
      }
      .dmg {
        position: absolute;
        top: 30%;
        font-family: Georgia, serif;
        font-size: 3.4rem;
        font-weight: 900;
        animation: dmg 1.6s forwards;
        text-shadow: 0 0 18px currentColor, 0 3px 6px #000;
      }
      .dmg.d-pos {
        left: 18%;
        color: var(--gold2);
      }
      .dmg.d-neg {
        right: 18%;
        color: #ff7f95;
      }
      .dmg.d-draw {
        left: 50%;
        transform: translateX(-50%);
        color: #ddd;
      }
      @keyframes dmg {
        0% {
          transform: translateY(30px) scale(0.4);
          opacity: 0;
        }
        25% {
          transform: translateY(-6px) scale(1.3);
          opacity: 1;
        }
        100% {
          transform: translateY(-70px) scale(1);
          opacity: 0;
        }
      }
      .buffpop {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        pointer-events: none;
        text-align: center;
        max-width: 90%;
      }
      .buffpop .bp {
        background: linear-gradient(90deg, #3b1d7a, #7a1b3a);
        border: 1px solid var(--gold);
        padding: 8px 18px;
        border-radius: 30px;
        animation: bp 1.6s forwards;
        box-shadow: 0 0 30px rgba(245, 196, 81, 0.5);
        font-size: 0.9rem;
      }
      .buffpop .bp b {
        color: var(--gold2);
        letter-spacing: 0.1em;
      }
      @keyframes bp {
        0% {
          transform: translateY(-30px) scale(0.5);
          opacity: 0;
        }
        20% {
          transform: none;
          opacity: 1;
        }
        85% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      /* ===== CALC ===== */
      .calc {
        margin-top: 12px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 6px 14px;
        min-height: 10px;
      }
      .calc:empty {
        display: none;
      }
      .cl {
        display: grid;
        grid-template-columns: 130px 1fr;
        gap: 10px;
        padding: 7px 0;
        border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
        font-size: 0.9rem;
        animation: fadeUp 0.5s;
      }
      .cl:last-child {
        border-bottom: 0;
      }
      .cl .k {
        color: var(--mut);
      }
      .cl.res {
        font-weight: 700;
      }
      .cl.res.pos {
        color: var(--gold2);
      }
      .cl.res.neg {
        color: #ff8da0;
      }
      .cl.res.draw {
        color: #ddd;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .verdict {
        text-align: center;
        font-family: Georgia, serif;
        font-size: 1.3rem;
        margin: 12px 0 4px;
        animation: fadeUp 0.6s;
      }
      .verdict.pos {
        color: var(--gold2);
      }
      .verdict.neg {
        color: #ff8da0;
      }
      .actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin: 14px 0;
      }
      .selinfo {
        color: var(--mut);
        font-size: 0.9rem;
      }
      .selinfo b {
        color: #fff;
        font-family: Georgia, serif;
        font-size: 1.1rem;
      }
      details.log {
        margin-top: 10px;
        font-size: 0.84rem;
        color: var(--mut);
      }
      details.log summary {
        cursor: pointer;
        padding: 6px 0;
      }
      .logline {
        padding: 3px 0;
        border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
      }

      /* ===== COLLECTION ===== */
      .collection {
        background: rgba(0, 0, 0, 0.28);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 12px;
        margin-top: 6px;
      }
      .coll-head {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 0.88rem;
        margin-bottom: 8px;
      }
      .coll-head b.p {
        color: var(--gold);
      }
      .coll-head b.n {
        color: #ff7f95;
      }
      .filters {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .fbtn {
        padding: 5px 11px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--line);
        font-size: 0.78rem;
      }
      .fbtn.act {
        background: var(--gold);
        color: #2a1d00;
        font-weight: 800;
        border-color: var(--gold);
      }
      .cardgrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
        gap: 16px 10px;
        max-height: 46vh;
        overflow-y: auto;
        padding: 14px 6px 10px;
        justify-items: center;
      }
      .cardgrid::-webkit-scrollbar {
        width: 8px;
      }
      .cardgrid::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 8px;
      }
      .cardgrid .card {
        --cw: 104px;
      }
      .nocards {
        grid-column: 1/-1;
        color: var(--mut);
        padding: 20px;
      }

      /* ===== CARD ===== */
      .card {
        --cw: 112px;
        position: relative;
        width: var(--cw);
        height: calc(var(--cw) * 1.45);
        font-size: calc(var(--cw) / 11);
        border-radius: 0.95em;
        padding: 0.5em 0.5em 0.45em;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        overflow: hidden;
        user-select: none;
        color: #fff;
        transition: transform 0.25s, box-shadow 0.25s, filter 0.25s;
        border: 0.18em solid;
      }
      .card.pos {
        background: linear-gradient(
          165deg,
          #3f7fd6 0%,
          #1f4a8e 55%,
          #0d1f40 100%
        );
        border-color: var(--gold);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5),
          inset 0 0 22px rgba(245, 196, 81, 0.25);
      }
      .card.neg {
        background: linear-gradient(
          165deg,
          #7a2fb0 0%,
          #3a1458 50%,
          #16050e 100%
        );
        border-color: var(--red);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5),
          inset 0 0 22px rgba(211, 48, 74, 0.3);
      }
      .card.tier3.pos {
        border-color: #fff1b8;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5),
          0 0 18px rgba(245, 196, 81, 0.55),
          inset 0 0 24px rgba(245, 196, 81, 0.4);
      }
      .card.tier3.neg {
        border-color: #ff7189;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5),
          0 0 18px rgba(211, 48, 74, 0.6),
          inset 0 0 24px rgba(211, 48, 74, 0.45);
      }
      .c-top {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 800;
        font-size: 1em;
        font-family: Georgia, serif;
      }
      .card.pos .c-top {
        color: var(--gold2);
      }
      .card.neg .c-top {
        color: #ffb0bf;
      }
      .stars {
        letter-spacing: 0.1em;
        font-size: 0.85em;
      }
      .c-art {
        flex: 1;
        width: 100%;
        min-height: 0;
        border-radius: 0.6em;
        background: rgba(0, 0, 0, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0.25em 0;
      }
      .c-art svg {
        height: 100%;
        width: auto;
        max-width: 100%;
      }
      .c-num {
        font-family: Georgia, serif;
        font-weight: 900;
        font-size: 2.7em;
        line-height: 1;
        color: #fff;
        text-shadow: 0 0.06em 0.18em rgba(0, 0, 0, 0.85), 0 0 0.5em currentColor;
      }
      .card.pos .c-num {
        text-shadow: 0 0.06em 0.15em rgba(0, 0, 0, 0.9),
          0 0 0.45em rgba(245, 196, 81, 0.8);
      }
      .card.neg .c-num {
        text-shadow: 0 0.06em 0.15em rgba(0, 0, 0, 0.9),
          0 0 0.45em rgba(211, 48, 74, 0.9);
      }
      .c-num .sg {
        font-size: 0.75em;
        margin-right: 0.04em;
      }
      .c-name {
        font-size: 0.62em;
        letter-spacing: 0.16em;
        font-weight: 700;
        text-transform: uppercase;
        text-align: center;
        opacity: 0.92;
      }
      .c-realm {
        font-size: 0.56em;
        letter-spacing: 0.14em;
        opacity: 0.7;
        text-transform: uppercase;
      }
      .c-buff {
        position: absolute;
        top: 2.1em;
        right: 0.35em;
        z-index: 2;
        width: 1.9em;
        height: 1.9em;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.7);
        border: 0.1em solid var(--gold2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.05em;
        box-shadow: 0 0 0.8em rgba(245, 196, 81, 0.8);
      }
      .card.morph {
        animation: morph 1.1s ease-out;
      }
      @keyframes morph {
        0% {
          transform: scale(1);
        }
        25% {
          transform: scale(1.18) rotate(-4deg);
          filter: brightness(2.2) saturate(1.6);
        }
        55% {
          transform: scale(1.1) rotate(3deg);
          filter: brightness(1.5);
        }
        100% {
          transform: none;
          filter: none;
        }
      }
      .card.aura {
        animation: auraP 1.2s ease-out;
      }
      @keyframes auraP {
        0%,
        100% {
          filter: none;
        }
        40% {
          filter: brightness(1.5);
        }
      }
      .c-used {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(-18deg);
        background: rgba(0, 0, 0, 0.75);
        border: 2px solid #aaa;
        color: #ddd;
        padding: 0.15em 0.6em;
        font-weight: 900;
        letter-spacing: 0.14em;
        font-size: 0.82em;
        border-radius: 6px;
      }
      .card.used {
        filter: grayscale(1) brightness(0.5);
        cursor: not-allowed;
      }
      .card.used .c-used {
        display: block;
      }
      .card.pickable {
        cursor: pointer;
      }
      .card.pickable:hover {
        transform: translateY(-8px);
      }
      .card.selected {
        transform: translateY(-14px) scale(1.05);
        animation: glow 1.4s infinite;
        z-index: 2;
      }
      .card.pos.selected {
        --g: rgba(245, 196, 81, 0.9);
      }
      .card.neg.selected {
        --g: rgba(255, 80, 110, 0.9);
      }
      @keyframes glow {
        0%,
        100% {
          box-shadow: 0 0 0 2px #fff, 0 0 18px 3px var(--g);
        }
        50% {
          box-shadow: 0 0 0 2px #fff, 0 0 36px 10px var(--g);
        }
      }

      /* ===== SKENARIO, TIMER, SUASANA ===== */
      .scenario {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        padding: 14px 16px;
        border-radius: 16px;
        margin-bottom: 12px;
        background: linear-gradient(
          135deg,
          rgba(60, 20, 90, 0.55),
          rgba(90, 10, 35, 0.5)
        );
        border: 1px solid rgba(255, 120, 150, 0.35);
        box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.45),
          0 0 26px rgba(154, 77, 255, 0.15);
        animation: fadeUp 0.6s;
      }
      .scenario .sc-ic {
        font-size: 2.4rem;
        filter: drop-shadow(0 0 10px rgba(255, 90, 120, 0.6));
        animation: flick 3s infinite;
      }
      .sc-tag {
        font-size: 0.68rem;
        letter-spacing: 0.3em;
        color: #ff9db0;
      }
      .sc-title {
        font-family: Georgia, serif;
        font-size: 1.15rem;
        color: var(--gold2);
        letter-spacing: 0.05em;
      }
      .scenario p {
        font-size: 0.9rem;
        line-height: 1.5;
        color: #d8d2ee;
        margin-top: 4px;
      }
      .scenario .whisper {
        font-style: italic;
        color: #e3c8ff;
      }
      .scenario .tension {
        color: #ffb3a7;
        font-weight: 700;
      }
      .scenario .omen {
        color: var(--gold2);
      }
      .scenario.compact {
        text-align: left;
        margin: 0 0 16px;
      }
      @keyframes flick {
        0%,
        100% {
          opacity: 1;
        }
        45% {
          opacity: 0.75;
        }
        50% {
          opacity: 1;
        }
        55% {
          opacity: 0.6;
        }
      }
      .timer {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
        font-size: 0.85rem;
      }
      .tbar {
        flex: 1;
        height: 8px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }
      .tbar i {
        display: block;
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #d3304a, #f5c451, #4aa8ff);
        transition: width 0.3s linear;
      }
      .timer span {
        min-width: 130px;
        text-align: right;
        font-weight: 700;
        font-family: Georgia, serif;
      }
      .timer.low span {
        color: #ff6e86;
        animation: blink 0.5s infinite alternate;
      }
      @keyframes blink {
        to {
          opacity: 0.4;
        }
      }
      body.tense::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 40;
        box-shadow: inset 0 0 160px 20px rgba(0, 0, 0, 0.65);
      }
      body.panic::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 41;
        box-shadow: inset 0 0 140px 30px rgba(220, 0, 40, 0.5);
        animation: panic 0.9s infinite;
      }
      @keyframes panic {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
      .dawn {
        text-align: center;
        color: #d9c7ff;
        font-style: italic;
        margin: 12px 0 0;
        animation: fadeUp 0.6s;
      }
      .narr {
        color: #ffb8c6;
        font-style: normal;
      }
      input[type="range"] {
        width: 140px;
      }

      /* ===== OVERLAY / MODAL ===== */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: radial-gradient(circle at 50% 40%, #17102b, #050409 70%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        animation: fadeIn 0.3s;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .pass-box {
        max-width: 560px;
        text-align: center;
      }
      .pass-box .big-ic {
        font-size: 4rem;
        margin-bottom: 8px;
      }
      .pass-box h2 {
        font-size: clamp(1.3rem, 4vw, 2rem);
        color: var(--gold2);
        margin-bottom: 12px;
        line-height: 1.3;
      }
      .pass-box.neg h2 {
        color: #ff8da0;
      }
      .pass-box p {
        color: #cfc9e6;
        line-height: 1.6;
        margin-bottom: 20px;
      }
      .pass-box .buffbar {
        text-align: left;
        margin: 0 0 20px;
      }
      .pass-inline {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 30px 20px;
        margin-top: 10px;
      }
      .cover {
        position: fixed;
        inset: 0;
        z-index: 300;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #777;
        padding: 20px;
        cursor: pointer;
      }
      .cover[hidden] {
        display: none;
      }
      .modal-bg {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: rgba(0, 0, 0, 0.75);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        animation: fadeIn 0.2s;
      }
      .modal {
        position: relative;
        width: min(760px, 100%);
        max-height: 90vh;
        overflow: auto;
        background: #14102a;
        border: 1px solid rgba(245, 196, 81, 0.35);
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 30px 80px #000;
      }
      .modal h2 {
        color: var(--gold2);
        margin-bottom: 12px;
      }
      .modal h3 {
        color: var(--gold);
        font-size: 1rem;
        margin: 14px 0 6px;
      }
      .modal p,
      .modal li {
        color: #cfc9e6;
        line-height: 1.6;
        font-size: 0.92rem;
      }
      .modal ul {
        padding-left: 20px;
      }
      .modal .x {
        position: absolute;
        right: 12px;
        top: 10px;
        font-size: 1.2rem;
        padding: 6px 10px;
        color: var(--mut);
      }
      .modal .mrow {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 18px;
        flex-wrap: wrap;
      }
      .setrow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
        font-size: 0.92rem;
      }
      .setrow small {
        display: block;
        color: var(--mut);
      }
      .setrow input[type="number"] {
        width: 80px;
        padding: 6px;
        border-radius: 8px;
        background: #000;
        color: #fff;
        border: 1px solid var(--line);
      }
      .testrow {
        padding: 6px 0;
        border-bottom: 1px dashed var(--line);
        font-size: 0.88rem;
      }
      .testrow.ok b {
        color: #6df0a0;
      }
      .testrow.bad b {
        color: #ff6e86;
      }
      .testrow small {
        display: block;
        color: var(--mut);
      }
      table.hist {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.8rem;
      }
      table.hist th,
      table.hist td {
        padding: 5px 6px;
        border-bottom: 1px solid var(--line);
        text-align: center;
      }
      table.hist th {
        color: var(--gold);
        position: sticky;
        top: 0;
        background: #14102a;
      }
      .tw {
        max-height: 55vh;
        overflow: auto;
      }
      td.cp {
        color: #9cd1ff;
      }
      td.cn {
        color: #ffa3b3;
      }

      /* ===== FINAL ===== */
      .final {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px 16px 60px;
      }
      .winner {
        text-align: center;
        padding: 30px 16px;
        border-radius: 22px;
        margin-bottom: 18px;
        border: 1px solid var(--line);
        background: var(--panel);
      }
      .winner h1 {
        font-size: clamp(1.6rem, 5vw, 2.8rem);
        margin: 6px 0;
      }
      .winner.pos {
        box-shadow: 0 0 60px rgba(245, 196, 81, 0.25);
        border-color: var(--gold);
      }
      .winner.pos h1 {
        color: var(--gold2);
      }
      .winner.neg {
        box-shadow: 0 0 60px rgba(211, 48, 74, 0.3);
        border-color: var(--red);
      }
      .winner.neg h1 {
        color: #ff8da0;
      }
      .winner .big-ic {
        font-size: 3.4rem;
      }
      .fgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-bottom: 16px;
      }
      .fcard {
        background: var(--panel);
        border-radius: 16px;
        padding: 16px;
        border: 1px solid var(--line);
      }
      .fcard.pos {
        border-color: rgba(245, 196, 81, 0.4);
      }
      .fcard.neg {
        border-color: rgba(211, 48, 74, 0.45);
      }
      .fcard h3 {
        margin-bottom: 8px;
      }
      .fcard.pos h3 {
        color: var(--gold);
      }
      .fcard.neg h3 {
        color: #ff7f95;
      }
      .chartbox {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
        margin-bottom: 16px;
      }
      .chartbox svg {
        width: 100%;
        height: auto;
      }
      .legend {
        display: flex;
        gap: 16px;
        justify-content: center;
        font-size: 0.82rem;
        margin-top: 4px;
      }
      .verify {
        font-size: 0.82rem;
        color: #8fe9b3;
        text-align: center;
        margin: 8px 0;
      }
      .verify.bad {
        color: #ff8da0;
      }
      .fact {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 6px;
        margin-bottom: 16px;
      }
      .sumcell {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 6px 8px;
        font-size: 0.76rem;
        text-align: center;
      }
      .sumcell.pos {
        border-color: rgba(245, 196, 81, 0.5);
      }
      .sumcell.neg {
        border-color: rgba(211, 48, 74, 0.55);
      }
      .sumcell.draw {
        border-color: #777;
      }
      .sumcell b {
        display: block;
        color: var(--mut);
        font-weight: 600;
      }

      @media (max-width: 960px) {
        .layout {
          grid-template-columns: 1fr 1fr;
          padding: 10px;
          gap: 10px;
        }
        .center {
          grid-column: 1/-1;
          order: -1;
        }
        .panel {
          padding: 12px;
        }
        .army .num {
          font-size: 2.1rem;
        }
        .arena {
          --cw: 116px;
        }
        .cardgrid {
          grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
        }
        .cardgrid .card {
          --cw: 84px;
        }
        .fgrid {
          grid-template-columns: 1fr;
        }
        .cl {
          grid-template-columns: 1fr;
          gap: 2px;
        }
        .brand {
          font-size: 0.85rem;
        }
      }
      @media (max-width: 560px) {
        .arena {
          --cw: 92px;
          gap: 10px;
        }
        .countdown {
          font-size: 3.4rem;
        }
        .names {
          grid-template-columns: 1fr;
        }
        .layout {
          grid-template-columns: 1fr;
        }
        .pubhist {
          display: none;
        }
      }

      /* ===== ONLINE ===== */
      .menu-card.wide {
        width: min(760px, 100%);
      }
      .mode-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        text-align: left;
        margin: 6px 0 14px;
      }
      .mode {
        background: rgba(0, 0, 0, 0.28);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
      }
      .mode h3 {
        font-size: 1.05rem;
        margin-bottom: 8px;
      }
      .mode label {

  <body>
    <div id="app"></div>
    <div id="modal-root"></div>
    <script src="/game-core.js"></script>
    <script>
      "use strict";
      /* =====================================================================
   POSITIVE vs NEGATIVE: WAR OF KINGDOMS — MODE ONLINE (2 pemain)
   Server (api/room.js) menyimpan state & menghitung hasil. Klien hanya menampilkan
   dan mengirim aksi. Pilihan kartu lawan tidak pernah dikirim ke klien sebelum dibuka.
   ===================================================================== */
      const {
        MAX_ROUNDS,
        BUFF_ICONS,
        range,
        fmt,
        fmtE,
        tierOf,
        tierName,
        pickRand,
        KNAME,
        scenarioFor,
        summarize,
        verifyState,
        explainEntry,
      } = GameCore;
      const API = "/api/room";
      const SESSION_KEY = "pnwok_online_v1",
        SET_KEY = "pnwok_settings_v2",
        NAME_KEY = "pnwok_name_v1";
      const DEFAULT_SETTINGS = {
        countdown: 3,
        anim: true,
        sound: true,
        music: true,
        volume: 70,
        narrator: false,
        autoFullscreen: true, // HP: ketukan pertama otomatis masuk layar penuh
        haptics: true, // getar ringan saat memilih / mengunci kartu
      };

      let settings = loadSettings();
      let ON = null; // sesi: { code, token, side, name }
      let V = null; // tampilan terbaru dari server
      let selCard = null; // kartu yang sedang dipilih (belum dikunci, hanya di perangkat ini)
      let cardFilter = "all";
      let animToken = 0,
        skipAnim = false,
        bumpSide = null,
        animating = false,
        animPhase = null,
        animatedKey = null;
      let scoreHeld = false; // true selama animasi reveal berjalan sampai popup "+N" muncul: panel skor masih menampilkan nilai SEBELUM ronde ini
      let announcedKey = "",
        finaleKey = "",
        lastAutoShown = 0;
      let clockOffset = 0,
        pollTimer = null,
        failCount = 0,
        connLost = false,
        busy = false,
        confirmCb = null,
        toastTimer = null;
      let menuForm = {
        name: "",
        code: "",
        buffChance: 35,
        initialArmy: 0,
        timer: 60,

      function chartSVG(st) {
        const W = 640,
          H = 250,
          pad = 38,
          tl = st.armyTimeline;
        const maxV = Math.max(
          1,
          ...tl.map((t) => Math.max(t.positive, t.negative))
        );
        const x = (i) => pad + (i * (W - 2 * pad)) / st.maxRounds,
          y = (v) => H - pad - (v / maxV) * (H - 2 * pad);
        let s =
          '<svg viewBox="0 0 ' +
          W +
          " " +
          H +
          '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Grafik total pasukan per ronde">';
        for (let i = 0; i <= 4; i++) {
          const v = Math.round((maxV * i) / 4),
            yy = y(v);
          s +=
            '<line x1="' +
            pad +
            '" x2="' +
            (W - pad) +
            '" y1="' +
            yy +
            '" y2="' +
            yy +
            '" stroke="rgba(255,255,255,.1)"/><text x="' +
            (pad - 6) +
            '" y="' +
            (yy + 4) +
            '" fill="#9d98b8" font-size="11" text-anchor="end">' +
            v +
            "</text>";
        }
        for (let r = 0; r <= st.maxRounds; r += 5)
          s +=
            '<text x="' +
            x(r) +
            '" y="' +
            (H - pad + 16) +
            '" fill="#9d98b8" font-size="11" text-anchor="middle">R' +
            r +
            "</text>";
        const line = (k, c) =>
          '<polyline fill="none" stroke="' +
          c +
          '" stroke-width="3" stroke-linejoin="round" points="' +
          tl.map((t) => x(t.round) + "," + y(t[k])).join(" ") +
          '"/>';
        s +=
          line("positive", "#f5c451") + line("negative", "#ff5b78") + "</svg>";
        return s;

          prev = hist[hist.length - 1];

          na = prev ? prev.negativeArmyAfter : st.initialArmy.negative;
        return Object.assign({}, st, {
          battleHistory: hist,
          positiveArmy: pa,
          negativeArmy: na,
          positiveGained: pa - st.initialArmy.positive,
          negativeGained: na - st.initialArmy.negative,
          positiveRoundWins: hist.filter((x) => x.winner === "positive").length,
          negativeRoundWins: hist.filter((x) => x.winner === "negative").length,
          draws: hist.filter((x) => x.winner === "draw").length,

          "<h3>Buff (mulai ronde 11)</h3><p>Pada ronde 11–30 (20 ronde terakhir), buff muncul secara acak (peluang dapat diatur), tetapi <b>semua 8 jenis buff dijamin muncul minimal sekali</b> dalam satu pertandingan. <b>DOUBLE POWER</b> muncul tepat 2 kali: sekali untuk Kerajaan Positif dan sekali untuk Kerajaan Negatif, jadi adil untuk kedua pihak. Bila peluang buff diatur 0%, tidak ada buff sama sekali. Buff ditentukan di awal ronde dan terlihat oleh <b>kedua pemain</b> sebelum memilih kartu. Peluang buff di <b>ronde 11 dibuat lebih tinggi</b> agar permainan makin seru. NEGATIVE CURSE (kartu buff negatif) dan POSITIVE BLESSING (kartu buff positif) memakai <b>undian kerajaan yang baru dilakukan setelah kedua pemain memilih kartu</b> (saat kartu dibuka). <b>NEGATIVE CURSE</b>: jatuh ke Kerajaan Negatif → kartunya menjadi positif; jatuh ke Kerajaan Positif → kartunya menjadi negatif. <b>POSITIVE BLESSING</b>: jatuh ke Kerajaan Negatif → kartunya tetap negatif; jatuh ke Kerajaan Positif → kartunya tetap positif. Contoh Curse: +8 vs −7 dan undian jatuh ke Kerajaan Positif → −8 −7 = −15, yaitu 15 pasukan untuk Kerajaan Negatif. Saat terkena buff, kartu di arena berubah tampilannya sesuai nilai efektifnya. Buff lain: DOUBLE POWER, WEAKENING, KINGDOM SHIELD, MIRROR CURSE, CHAOS CARD, ABSOLUTE SEAL.</p>" +
          "<h3>Bluffing</h3><p>Riwayat kartu yang sudah terbuka bersifat publik. Baca pola lawan, pura-pura menyimpan kartu kuat, lalu jebak mereka. Game tidak memberi saran apa pun.</p>" +
          "<h3>Suasana ala Werewolf</h3><p>Setiap ronde adalah satu <b>malam</b> dengan skenario naratif, bisikan untuk tiap pemain, dan pertanda buff. Skenario hanya narasi, tidak mengubah angka atau memberi petunjuk tentang kartu lawan. Ada musik latar, efek suara, dan timer berpikir opsional (diatur pembuat ruangan).</p><h3>Ruangan online</h3><p>Pembuat ruangan memegang Kerajaan Positif dan menentukan peluang buff, pasukan awal, dan timer. Pemain yang bergabung dengan kode memegang Kerajaan Negatif. <b>Room Master:</b> pembuat ruangan juga boleh memilih peran Room Master. Ia mengatur peluang buff, pasukan awal, dan timer, lalu hanya menonton: pemain pertama yang masuk memegang Kerajaan Positif dan yang kedua Kerajaan Negatif. Master melihat skor, status kunci, dan hasil tiap ronde, tetapi tidak melihat kartu yang belum dibuka dan tidak bisa mengambil aksi apa pun. Bila master keluar, ruangan ditutup. Bila koneksimu terputus, muat ulang halaman: kamu otomatis kembali ke ruanganmu selama ruangan masih aktif.</p>"
        );
      }

      /* ---------- pengaturan (hanya preferensi perangkat ini) ---------- */
      function loadSettings() {
        const s = Object.assign({}, DEFAULT_SETTINGS);
        try {
          const raw = localStorage.getItem(SET_KEY);
          if (raw) Object.assign(s, JSON.parse(raw));
        } catch (e) {
          /* abaikan */
        }
        s.countdown = Math.min(
          5,
          Math.max(1, Math.round(Number(s.countdown)) || 3)
        );
        s.anim = !!s.anim;
        s.sound = !!s.sound;
        s.music = !!s.music;
        s.narrator = !!s.narrator;
        s.autoFullscreen = s.autoFullscreen !== false;
        s.haptics = s.haptics !== false;
        s.volume = Math.min(100, Math.max(0, Number(s.volume)));
        if (isNaN(s.volume)) s.volume = 70;
        return s;
      }
      function saveSettings() {
        try {
          localStorage.setItem(SET_KEY, JSON.stringify(settings));
        } catch (e) {}
      }
      function setSetting(k, v) {
        if (k === "countdown")
          v = Math.min(5, Math.max(1, Math.round(Number(v)) || 3));
        if (k === "volume") v = Math.min(100, Math.max(0, Number(v) || 0));
        settings[k] = v;
        saveSettings();
        if (k === "sound" || k === "music" || k === "volume") Sfx.apply();
        if (V && !animating) renderGame();
      }

      /* ---------- sesi & jaringan ---------- */
      function saveSession() {
        try {
          localStorage.setItem(SESSION_KEY, JSON.stringify(ON));
        } catch (e) {}
      }
      function loadSession() {
        try {
          const o = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
          return o && o.code && o.token ? o : null;
        } catch (e) {
          return null;
        }
      }
      function clearSession() {
        try {
          localStorage.removeItem(SESSION_KEY);
        } catch (e) {}
      }
      async function call(action, extra) {
        const body = Object.assign(
          { action },
          ON ? { code: ON.code, token: ON.token } : {},
          extra || {}
        );
        let r, j;
        try {
          r = await fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          j = await r.json();
        } catch (e) {
          throw Object.assign(
            new Error(
              "Tidak bisa terhubung ke server. Periksa koneksi internetmu."
            ),
            { status: 0 }
          );
        }
        if (!j.ok)
          throw Object.assign(new Error(j.error || "Terjadi kesalahan."), {
            status: r.status,
          });
        return j;
      }
      function toast(msg) {
        let t = document.getElementById("toast");
        if (!t) {
          t = document.createElement("div");
          t.id = "toast";
          t.className = "toast";
          document.body.appendChild(t);
        }
        t.textContent = msg;
        t.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          t.hidden = true;
        }, 4200);
      }
      function handleErr(e) {
        if (e.status === 401 || e.status === 404) {
          sessionLost(e.message);
          return;
        }
        toast(e.message || "Terjadi kesalahan.");
      }
      function sessionLost(msg) {
        stopPolling();
        clearSession();
        animToken++;
        animating = false;
        animPhase = null;
        scoreHeld = false;
        ON = null;
        V = null;
        selCard = null;
        stopTimer();
        renderGame();
        if (msg) toast(msg);
      }

      /* ---------- polling ---------- */
      function stopPolling() {
        if (pollTimer) clearTimeout(pollTimer);
        pollTimer = null;
      }
      function pollDelay() {
        if (document.hidden) return 4000;
        const ph = uiPhase();
        return ph === "waiting" || ph === "lobby" || ph === "result"
          ? 900
          : 1300;
      }
      function startPolling() {
        stopPolling();
        const loop = async () => {
          if (!ON) return;
          await pollOnce();
          if (ON) pollTimer = setTimeout(loop, pollDelay());
        };
        pollTimer = setTimeout(loop, 700);
      }
      async function pollOnce() {
        if (!ON) return;
        try {
          const r = await fetch(
            API +
              "?" +
              new URLSearchParams({
                code: ON.code,
                token: ON.token,
                v: V ? V.v : 0,
              }),
            { cache: "no-store" }
          );
          const j = await r.json();
          if (!j.ok) {
            if (r.status === 404 || r.status === 401) {
              sessionLost(j.error);
              return;
            }
            throw new Error(j.error);
          }
          failCount = 0;
          const wasLost = connLost;
          connLost = false;
          if (j.unchanged) {
            clockOffset = j.serverNow - Date.now();
            if (
              V &&
              (V.oppOnline !== j.oppOnline ||
                wasLost ||
                (j.online &&
                  JSON.stringify(V.online) !== JSON.stringify(j.online)))
            ) {
              V.oppOnline = j.oppOnline;
              if (j.online) V.online = j.online;
              if (!animating) renderGame();
            }
            return;
          }
          applyView(j.view);
        } catch (e) {
          failCount++;
          if (failCount >= 3 && !connLost) {
            connLost = true;
            if (V && !animating) renderGame();
          }
        }
      }

      /* ---------- fase tampilan ---------- */
      function myLocked() {
        return V && V.g && (ON.side === "pos" ? V.g.p1Locked : V.g.p2Locked);
      }
      function uiPhase() {
        if (!ON || !V) return "menu";
        if (V.status === "lobby") return "lobby";
        if (V.status === "abandoned") return "abandoned";
        if (animPhase) return animPhase;
        if (V.phase === "final") return "final";
        if (V.phase === "resolved") return "result";
        if (isMaster()) return "waiting"; // Room Master hanya menonton, tidak pernah memilih kartu
        return myLocked() ? "waiting" : "select";
      }
      function stateForUI() {
        return Object.assign({}, V.g, {
          gamePhase: uiPhase(),
          player1Name: V.names.pos,
          player2Name: V.names.neg,
        });
      }
      const isMaster = () => !!ON && ON.side === "master";
      const oppSide = () => (ON.side === "pos" ? "neg" : "pos");
      const oppName = () => V.names[oppSide()] || "Lawan";
      const resKey = () => V.gameNo + ":" + V.g.battleHistory.length;

      function applyView(v) {
        const prev = V;
        V = v;
        clockOffset = v.serverNow - Date.now();
        if (!prev || prev.gameNo !== v.gameNo) {
          selCard = null;
          animatedKey = null;
          announcedKey = "";
          finaleKey = "";
          cardFilter = "all";
          lastAutoShown = 0;
        }
        if (v.g && selCard != null) {
          const used =
            ON.side === "pos" ? v.g.usedPositiveCards : v.g.usedNegativeCards;
          if (used.includes(selCard) || v.phase !== "select" || myLocked())
            selCard = null;
        }
        if (animating) return; // tampilan baru dipakai setelah animasi selesai
        if (v.g && v.phase === "resolved") {
          const key = resKey();
          if (!prev && animatedKey === null) animatedKey = key; // sambung ulang: langsung ke hasil
          if (animatedKey !== key) {
            runReveal();
            return;
          }
        }
        renderGame();
        afterRender();
      }
      function afterRender() {
        if (!V || !V.g) return;
        const ph = uiPhase();
        if (ph === "select" || ph === "waiting") {
          const key = V.gameNo + ":" + V.g.currentRound;
          if (announcedKey !== key) {
            announcedKey = key;
            Sfx.night();
            window.scrollTo(0, 0);
            const sc = scenarioFor(V.g.currentRound);
            speak(
              "Malam ke-" + V.g.currentRound + ". " + sc.title + ". " + sc.story
            );
          }
        }
        if (
          V.autoPicked &&
          V.autoPicked !== lastAutoShown &&
          (ph === "result" || ph === "select")
        ) {
          lastAutoShown = V.autoPicked;
          toast(
            "⏰ Waktu habis: kartu yang belum dikunci dipilihkan otomatis oleh server."
          );
        }
        if (ph === "final") {
          const k = V.gameNo + ":final";
          if (finaleKey !== k) {
            finaleKey = k;
            Sfx.finale(summarize(V.g).winner);
            window.scrollTo(0, 0);
          }
        }
      }

      /* ---------- timer (tenggat dari server) ---------- */
      function timerHTML() {
        if (!V || !V.deadline) return "";
        return '<div class="timer" id="timer"><div class="tbar"><i id="timerBar"></i></div><span id="timerNum"></span></div>';
      }
      let timerState = null,
        timerInt = null;
      function stopTimer() {
        if (timerInt) {
          clearInterval(timerInt);
          timerInt = null;
        }
        timerState = null;
        if (typeof document !== "undefined" && document.body)
          document.body.classList.remove("panic");
      }
      function tickTimer() {
        if (!timerState || !V) return;
        const left = Math.ceil((timerState.end - Date.now()) / 1000);
        const mine = uiPhase() === "select";
        if (left !== timerState.lastSec) {
          timerState.lastSec = left;
          if (mine && left > 0 && left <= 10) Sfx.heartbeat(left);
          if (mine && left === 0) Sfx.alarm();
        }
        const num = document.getElementById("timerNum"),
          bar = document.getElementById("timerBar"),
          box = document.getElementById("timer");
        const total = V.cfg.timer || 1;
        if (num)
          num.textContent =
            left > 0
              ? "⏳ " + left + " dtk"
              : "⏰ Waktu habis! Kartu dipilihkan otomatis…";
        if (bar)
          bar.style.width =
            Math.max(0, Math.min(100, (left / total) * 100)) + "%";
        if (box) box.classList.toggle("low", left <= 10);
        document.body.classList.toggle("panic", mine && left <= 10);
      }
      function syncTimer() {
        const ph = uiPhase();
        if (!(ph === "select" || ph === "waiting") || !V || !V.deadline) {
          stopTimer();
          return;
        }
        const key = V.gameNo + ":" + V.g.currentRound,
          end = V.deadline - clockOffset;
        if (!timerState || timerState.key !== key)
          timerState = { key, end, lastSec: null };
        else timerState.end = end;
        if (!timerInt) timerInt = setInterval(tickTimer, 250);
        tickTimer();
      }
      function syncAtmosphere() {
        if (typeof document === "undefined") return;
        const ph = uiPhase(),
          sel = ph === "select" || ph === "waiting";
        document.body.classList.toggle("tense", sel);
        Sfx.setMood(sel || ph === "countdown" ? "tense" : "calm");
        syncTimer();
      }

      /* ---------- skenario (narasi saja) ---------- */
      function scenarioHTML(st) {
        const sc = scenarioFor(st.currentRound),
          ph = st.gamePhase;
        let h =
          '<div class="scenario" onclick="this.classList.toggle(\'open\')"><div class="sc-ic">' +
          sc.icon +
          '</div><div class="sc-tx"><div class="sc-tag">MALAM KE-' +
          st.currentRound +
          '</div><b class="sc-title">' +
          sc.title +
          "</b><p>" +
          sc.story +
          "</p>";
        if (ph === "select") {
          const side = ON.side === "pos" ? 1 : 2;
          h +=
            '<p class="whisper">“' +
            esc(whisperFor(st.currentRound, side, ON.name)) +
            "”</p>";
        }
        const t = tensionLine(st);
        if (t) h += '<p class="tension">' + t + "</p>";
        if (st.currentBuff)
          h +=
            '<p class="omen">🔮 Pertanda: ' +
            esc(st.currentBuff.name) +
            " mengintai medan perang malam ini.</p>";
        return h + "</div></div>";
      }

      /* ---------- aksi pemain ---------- */
      function selectCard(v) {
        if (uiPhase() !== "select") return;
        const pool = ON.side === "pos" ? V.g.positiveCards : V.g.negativeCards,
          used =
            ON.side === "pos" ? V.g.usedPositiveCards : V.g.usedNegativeCards;
        if (!pool.includes(v) || used.includes(v)) return;
        selCard = v;
        Sfx.select();
        buzz(12);
        refreshSelection();
      }
      function setFilter(f) {
        cardFilter = f;
        refreshSelection();
      }
      function refreshSelection() {
        const c = document.getElementById("collection"),
          a = document.getElementById("actions");
        if (!c || !a || !V) return;
        const g = document.getElementById("cardgrid");
        const top = g ? g.scrollTop : 0,
          st = stateForUI();
        c.innerHTML = collectionInner(st);
        a.innerHTML = actionsInner(st);
        const g2 = document.getElementById("cardgrid");
        if (g2) g2.scrollTop = top;
      }
      async function lockSelection() {
        if (busy || uiPhase() !== "select" || selCard == null) return;
        busy = true;
        try {
          const j = await call("lock", { card: selCard });
          Sfx.lock();
          buzz([20, 40, 30]);
          selCard = null;
          applyView(j.view);
        } catch (e) {
          handleErr(e);
          refreshSelection();
        } finally {
          busy = false;
        }
      }
      async function nextRound() {
        if (busy || uiPhase() !== "result") return;
        busy = true;
        try {
          const j = await call("ready");
          applyView(j.view);
        } catch (e) {
          handleErr(e);
        } finally {
          busy = false;
        }
      }
      async function requestRematch() {
        if (busy || uiPhase() !== "final") return;
        busy = true;
        try {
          const j = await call("rematch");
          applyView(j.view);
        } catch (e) {
          handleErr(e);
          renderGame();
        } finally {
          busy = false;
        }
      }
      function skipAnimation() {
        skipAnim = true;
      }
      function leaveRoom(force) {
        const ph = uiPhase();
        if (!force && ph !== "lobby" && ph !== "final" && ph !== "abandoned") {
          showConfirm(
            "Keluar dari permainan?",
            isMaster()
              ? "Sebagai Room Master, bila kamu keluar ruangan ditutup dan kedua pemain tidak bisa melanjutkan permainan."
              : "Lawanmu akan diberi tahu bahwa kamu meninggalkan ruangan. Permainan tidak bisa dilanjutkan.",
            "Ya, Keluar",
            () => leaveRoom(true)
          );
          return;
        }
        const had = ON;
        stopPolling();
        animToken++;
        animating = false;
        animPhase = null;
        scoreHeld = false;
        stopTimer();
        releaseAwake();
        if (had && ph !== "abandoned") call("leave").catch(() => {});
        clearSession();
        ON = null;
        V = null;
        selCard = null;
        connLost = false;
        failCount = 0;
        renderGame();
      }
      async function createRoom() {
        if (busy) return;
        const name = (menuForm.name || "").trim();
        if (!name) return menuErr("Isi nama atau nickname terlebih dahulu.");
        busy = true;
        menuErr("");
        try {
          const j = await call("create", {
            name,
            role: menuForm.role === "master" ? "master" : "player",
            cfg: {
              buffChance: menuForm.buffChance,
              initialArmy: menuForm.initialArmy,
              timer: menuForm.timer,
            },
          });
          enterRoom(j, name);
        } catch (e) {
          menuErr(e.message);
        } finally {
          busy = false;
        }
      }
      async function joinRoom() {
        if (busy) return;
        const name = (menuForm.name || "").trim(),
          code = (menuForm.code || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
        if (!name) return menuErr("Isi nama atau nickname terlebih dahulu.");
        if (code.length !== 5)
          return menuErr("Kode ruangan terdiri dari 5 karakter.");
        const saved = loadSession();
        busy = true;
        menuErr("");
        try {
          const j = await call("join", {
            code,
            name,
            token: saved && saved.code === code ? saved.token : undefined,
          });
          enterRoom(j, name);
        } catch (e) {
          menuErr(e.message);
        } finally {
          busy = false;
        }
      }
      function enterRoom(j, name) {
        ON = {
          code: j.code,
          token: j.token,
          side: j.side,
          name: j.view.names[j.side] || name,
        };
        saveSession();
        try {
          localStorage.setItem(NAME_KEY, menuForm.name);
        } catch (e) {}
        try {
          history.replaceState(null, "", location.pathname);
        } catch (e) {}
        V = null;
        failCount = 0;
        connLost = false;
        applyView(j.view);
        startPolling();
        armBackGuard();
        keepAwake();
      }
      function menuErr(m) {
        const e = document.getElementById("menuErr");
        if (e) {
          e.textContent = m;
          if (m) {
            const n = document.getElementById("names");
            if (n) {
              n.classList.remove("shake");
              void n.offsetWidth;
              n.classList.add("shake");
            }
          }
        }
      }
      function shareLink() {
        return (
          location.origin + location.pathname + "?room=" + (V ? V.code : "")
        );
      }
      function copyText(kind) {
        const txt = kind === "link" ? shareLink() : V.code;
        const done = () =>
          toast(
            kind === "link"
              ? "Tautan undangan disalin."
              : "Kode ruangan disalin."
          );
        if (navigator.clipboard && navigator.clipboard.writeText)
          navigator.clipboard
            .writeText(txt)
            .then(done, () => window.prompt("Salin manual:", txt));
        else window.prompt("Salin manual:", txt);
      }
      function toggleSound() {
        setSetting("sound", !settings.sound);
      }

      /* ---------- layar penuh, layar tetap menyala, getar, tombol kembali ---------- */
      const IS_TOUCH =
        typeof matchMedia !== "undefined" &&
        (matchMedia("(pointer: coarse)").matches ||
          navigator.maxTouchPoints > 0);
      const FS = (function () {
        const el = document.documentElement;
        const reqFn = el.requestFullscreen || el.webkitRequestFullscreen;
        const exitFn = document.exitFullscreen || document.webkitExitFullscreen;
        const isFs = () =>
          !!(document.fullscreenElement || document.webkitFullscreenElement);
        const standalone = () =>
          matchMedia("(display-mode: fullscreen)").matches ||
          matchMedia("(display-mode: standalone)").matches ||
          navigator.standalone === true;
        const iOS =
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        let userExited = false,
          autoTried = false;
        async function enter() {
          if (!reqFn || isFs()) return;
          try {
            await reqFn.call(el, { navigationUI: "hide" });
          } catch (e) {
            try {
              await reqFn.call(el);
            } catch (_) {}
          }
        }
        async function leave() {
          userExited = true;
          try {
            if (isFs() && exitFn) await exitFn.call(document);
          } catch (e) {}
        }
        function toggle() {
          if (isFs()) leave();
          else {
            userExited = false;
            enter();
          }
        }
        function onChange() {
          if (!isFs()) userExited = true; // pemain keluar sendiri → jangan paksa lagi
          if (typeof renderChrome === "function") renderChrome();
        }
        document.addEventListener("fullscreenchange", onChange);
        document.addEventListener("webkitfullscreenchange", onChange);
        // Ketukan pertama pemain di HP = satu-satunya saat browser mengizinkan layar penuh.
        function autoOnGesture() {
          if (
            autoTried ||
            userExited ||
            !IS_TOUCH ||
            !settings.autoFullscreen ||
            standalone() ||
            isFs()
          )
            return;
          autoTried = true;
          enter();
        }
        document.addEventListener("pointerup", autoOnGesture, {
          passive: true,
        });
        return {
          supported: !!reqFn,
          isFs,
          standalone,
          iOS,
          enter,
          toggle,
          leave,
        };
      })();
      function toggleFullscreen() {
        FS.toggle();
        setTimeout(renderChrome, 250);
      }
      function fsLabel() {
        return FS.isFs() ? "Keluar layar penuh" : "Layar penuh";
      }
      function fsBtnHTML(cls) {
        if (!FS.supported || FS.standalone()) return "";
        return (
          '<button class="btn ghost small fsbtn ' +
          (cls || "") +
          '" onclick="toggleFullscreen()" title="' +
          fsLabel() +
          '" aria-label="' +
          fsLabel() +
          '">' +
          (FS.isFs() ? "🗗" : "⛶") +
          "</button>"
        );
      }
      // Hint iPhone: Safari iPhone tidak punya API layar penuh → pakai Tambahkan ke Layar Utama.
      function iosHintHTML() {
        if (!FS.iOS || FS.supported || FS.standalone()) return "";

      // Layar tidak redup selagi menunggu lawan / membaca hasil
      let wakeLock = null;
      async function keepAwake() {
        try {
          if (!ON || !navigator.wakeLock || wakeLock || document.hidden) return;
          wakeLock = await navigator.wakeLock.request("screen");
          wakeLock.addEventListener("release", () => {
            wakeLock = null;
          });
        } catch (e) {
          wakeLock = null;
        }
      }
      function releaseAwake() {
        try {
          if (wakeLock) wakeLock.release();
        } catch (e) {}
        wakeLock = null;
      }
      // Tombol kembali Android: tanya dulu, jangan langsung keluar dari pertandingan

        if (backGuard || !ON) return;
        backGuard = true;
        try {
          history.pushState({ wok: 1 }, "");
        } catch (e) {}
      }
      window.addEventListener("popstate", () => {
        if (!backGuard) return;
        if (!ON) {
          backGuard = false;
          return;
        }
        try {
          history.pushState({ wok: 1 }, "");
        } catch (e) {}
        if (document.querySelector(".modal-bg")) closeModal();

      /* ---------- reveal tersinkron: kedua pemain memutar animasi dari hasil yang SAMA dari server ---------- */
      async function runReveal() {
        const key = resKey(),
          e = V.g.battleHistory[V.g.battleHistory.length - 1];
        animating = true;
        animPhase = "countdown";
        skipAnim = false;
        scoreHeld = true;
        const tok = ++animToken;
        renderGame();
        window.scrollTo(0, 0);
        const cd = () => document.getElementById("cd");
        for (let i = settings.countdown; i >= 1; i--) {
          Sfx.drum(i);
          if (cd()) {
            cd().textContent = i;
            cd().classList.remove("tick");
            void cd().offsetWidth;
            cd().classList.add("tick");
          }
          await sleep(850);
          if (tok !== animToken) return;
        }
        if (cd()) cd().textContent = "⚔";
        Sfx.boom();
        animPhase = "reveal";
        await playBattleAnimation(e, tok);
        if (tok !== animToken) return;
        animating = false;
        animPhase = null;
        animatedKey = key;
        scoreHeld = false;
        renderGame();
        speak(dawnText(e));
        afterRender();
      }

        if (ph === "menu") app.innerHTML = renderMenuHTML();
        else if (ph === "lobby") app.innerHTML = renderLobbyHTML();
        else if (ph === "abandoned") app.innerHTML = renderAbandonedHTML();
        else {
          const st = stateForUI();
          app.innerHTML =
            ph === "final" ? renderFinalHTML(st) : renderPlayHTML(st);
        }
        const g2 = document.getElementById("cardgrid");
        if (g2) g2.scrollTop = gTop;
        if (ph === "select" || ph === "waiting" || ph === "result")
          window.scrollTo(0, wTop);
        syncAtmosphere();
        renderChrome();
